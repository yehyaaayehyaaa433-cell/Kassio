<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0f1c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="نظام نقطة البيع الاحترافي - إدارة متجرك بسهولة" />
<title id="appTitle">مَتْجَرِي POS | نظام نقطة البيع</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Barcode Scanner Library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- Splash Screen -->
<div class="splash" id="splash">
  <div class="splash-content">
    <div class="splash-logo" id="splashLogo">م</div>
    <h1 id="splashName">مَتْجَرِي POS</h1>
    <p id="splashTag">نظام نقطة البيع الاحترافي</p>
    <div class="splash-loader"></div>
  </div>
</div>

<!-- App -->
<div class="app is-rtl" id="app" hidden>

  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo" id="topbarLogo">م</div>
      <div class="topbar-title">
        <strong id="topbarName">مَتْجَرِي POS</strong>
        <small id="topbarTag">نظام نقطة البيع</small>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="topbar-actions" id="topbarActions">
      <button class="icon-btn" id="themeBtn" title="المظهر">☀️</button>
      <button class="icon-btn" id="notifBtn" title="الإشعارات">
        🔔
        <span class="badge hidden" id="notifBadge">0</span>
      </button>
      <button class="icon-btn primary" id="menuBtn" title="القائمة">☰</button>
    </div>
  </header>

  <main class="content" id="viewRoot"></main>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastRoot"></div>

<!-- JavaScript Files -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/views.js"></script>
<script src="js/modals.js"></script>
<script src="js/app.js"></script>

</body>
</html>
